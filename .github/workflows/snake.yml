name: generate animation

on:
  # run automatically every 2 hours
  schedule:
    - cron: "0 */2 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563eb&color_dots=%23e8eef7,%23c3d5f6,%238aaee9,%234f82dd,%232563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300f5ff&color_dots=%231a2332,%2316435c,%230d6f8c,%2308a1cc,%2300f5ff

      # manually append a neon glow style to the generated svgs (Platane/snk has no glow support)
      - name: apply neon glow
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          GLOW = (
              '<style id="neon-glow">'
              '.s{filter:drop-shadow(0 0 4px var(--cs)) drop-shadow(0 0 12px var(--cs));'
              '-webkit-filter:drop-shadow(0 0 4px var(--cs)) drop-shadow(0 0 12px var(--cs))}'
              '</style>'
          )

          for f in [
              "dist/github-contribution-grid-snake.svg",
              "dist/github-contribution-grid-snake-dark.svg",
          ]:
              p = Path(f)
              s = p.read_text(encoding="utf-8")
              if "neon-glow" not in s:
                  s = s.replace("</style>", "</style>" + GLOW, 1)
                  p.write_text(s, encoding="utf-8")
              print(f"glow applied: {f}")
          PY

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
